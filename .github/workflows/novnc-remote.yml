name: novnc-remote

on:
  workflow_dispatch:        # Elle "Run workflow" ile tetiklenir

jobs:
  remote:
    runs-on: windows-latest
    timeout-minutes: 30      # Oturum bu süre sonunda otomatik kapanır
    steps:
      - name: TightVNC kur
        shell: powershell
        run: |
          $url = "https://www.tightvnc.com/download/2.8.81/tightvnc-2.8.81-gpl-setup-64bit.msi"
          Invoke-WebRequest -Uri $url -OutFile tightvnc.msi
          $pw = "${{ secrets.VNC_PASSWORD }}"
          msiexec /i tightvnc.msi /quiet /norestart `
            ADDLOCAL=Server `
            SERVER_REGISTER_AS_SERVICE=1 `
            SERVER_ADD_FIREWALL_EXCEPTION=1 `
            SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 `
            SET_PASSWORD=1 VALUE_OF_PASSWORD=$pw
          Start-Sleep -Seconds 20
          Get-Service tvnserver

      - name: noVNC + websockify kur ve başlat
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install websockify
          git clone --depth 1 https://github.com/novnc/noVNC.git
          Start-Process python -ArgumentList "-m","websockify","--web","noVNC","6080","localhost:5900"
          Start-Sleep -Seconds 5

      - name: cloudflared quick tunnel başlat
        shell: powershell
        run: |
          $cf = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
          Invoke-WebRequest -Uri $cf -OutFile cloudflared.exe
          Start-Process .\cloudflared.exe -ArgumentList "tunnel","--url","http://localhost:6080" -RedirectStandardError cf.log -RedirectStandardOutput cf.out
          Start-Sleep -Seconds 20
          Write-Host "==================== BAGLANTI ===================="
          Select-String -Path cf.log -Pattern "trycloudflare.com"
          Write-Host "Yukaridaki adresin sonuna /vnc.html ekleyip ac, sifre = VNC_PASSWORD"
          Write-Host "================================================="

      - name: Oturumu açık tut
        shell: powershell
        run: Start-Sleep -Seconds 1500   # ~25 dk bağlı kal
